name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: local.properties 더미 생성
        run: |
          cat > local.properties << 'EOF'
          TMDB_API_KEY=dummy
          KAKAO_NATIVE_APP_KEY=dummy
          KAKAO_REST_API_KEY=dummy
          EOF

      - name: google-services.json 더미 생성
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "dummy"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0",
                  "android_client_info": {
                    "package_name": "com.codealphas.themovie"
                  }
                },
                "api_key": [
                  { "current_key": "dummy" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew lint ktlintCheck
      - run: ./gradlew detekt
      - run: ./gradlew testDebugUnitTest :domain:test

      # Room Gradle 플러그인이 빌드할 때 data/schemas의 스키마 JSON을 다시 쓰므로,
      # 엔티티를 바꾸고 스키마 JSON을 커밋하지 않은 PR을 잡도록 새 파일까지 포함해 바뀐 내용이 있으면 실패 처리
      - name: Room 스키마 커밋 확인
        run: |
          git add --intent-to-add -- data/schemas
          git diff --exit-code -- data/schemas || { echo "엔티티 변경으로 다시 생성된 Room 스키마 JSON이 커밋되지 않았습니다."; exit 1; }

      - run: ./gradlew assembleDebug
