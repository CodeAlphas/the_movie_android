[versions]
agp = "9.4.1"
# AGP 9가 Kotlin Gradle Plugin을 내장하므로, Kotlin 컴파일러 플러그인이 같은 Kotlin으로 동작하도록 ./gradlew buildEnvironment에 나온 KGP 버전을 사용
kotlin = "2.2.10"
coreKtx = "1.16.0"
# core, Material, Hilt가 가져오는 1.4.0은 @Serializable을 InternalSerializationApi 사용으로 표시하므로, 1.6.0으로 고정
annotationExperimental = "1.6.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
constraintlayout = "2.1.4"
# Compose에서 Activity를 읽는 LocalActivity가 1.10.0부터 있으므로, Kotlin 1.8.22로 빌드되고 lifecycle 2.6.1을 요구하는 1.10.1 사용
activityKtx = "1.10.1"
fragmentKtx = "1.8.6"
# 1.4.0은 Kotlin 2.2.20으로 빌드되고 lifecycle을 2.11.0으로 올리므로, Kotlin 2.0.21로 빌드되고 lifecycle 2.9.1을 요구하는 1.3.0 사용
hiltLifecycleViewmodelCompose = "1.3.0"
recyclerview = "1.4.0"
lifecycle = "2.9.4"
# 2.10.0부터는 lifecycle을 2.11.0으로 올리므로, Kotlin 2.0.21로 빌드되고 lifecycle 2.9.0, kotlinx.serialization 1.7.3을 요구하는 2.9.8 사용
navigationCompose = "2.9.8"
# AGP 9 내장 Kotlin 2.2.10 컴파일러는 더 새 Kotlin으로 빌드된 Compose의 메타데이터를 읽지 못하므로, Compose 1.12.1과 Material3 1.4.0이 담긴 2026.09.00으로 고정
composeBom = "2026.09.00"
room = "2.7.2"
ksp = "2.3.12"
retrofit = "3.0.0"
# Retrofit 3.0.0이 가져오는 OkHttp가 4.12.0이므로, mockwebserver도 그 버전을 사용
okhttp = "4.12.0"
# 1.10.0부터는 Kotlin 2.3으로 빌드되므로, Kotlin 2.2.10에서 동작하도록 Kotlin 2.2.0으로 빌드된 1.9.0을 사용
kotlinxSerialization = "1.9.0"
coroutines = "1.10.2"
datastore = "1.2.1"
coil = "3.3.0"
# 16KB 페이지 크기는 2.11.8부터 지원하므로, 도입 시점에 저장소 maven-metadata.xml의 release였던 2.15.2 사용
kakaoMap = "2.15.2"
playServicesLocation = "21.3.0"
androidYoutubePlayer = "13.0.0"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
secrets = "2.0.1"
ktlint = "14.2.0"
# AGP 9용 Hilt Gradle 플러그인은 2.59부터이므로, 증분 빌드가 느린 HiltSyncTask를 고친 2.59.2를 사용
hilt = "2.59.2"
# detekt 1.23은 AGP 9의 built-in Kotlin을 분석하지 못하므로 2.0 alpha를 사용
detekt = "2.0.0-alpha.6"
# :domain의 @Inject는 javax.inject 애너테이션이므로 1을 사용
javaxInject = "1"

